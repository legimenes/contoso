# docker compose -p "contoso-pay" -f C:/workspace/repos/labs/contoso/contoso-pay/backend/docker-compose.yml up -d
services:

  postgres:
    image: postgres:18-alpine
    container_name: contosopay_postgres
    environment:
      POSTGRES_PASSWORD: pass@word1
    ports:
      - "5333:5432"
    volumes:
      - ./scripts/postgresql:/docker-entrypoint-initdb.d
      - contosopay_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 0s
    networks:
      - contosopay_network

volumes:
  contosopay_postgres_data:
    name: contosopay_postgres_data

networks:
  contosopay_network:
    name: contosopay_network
    driver: bridge